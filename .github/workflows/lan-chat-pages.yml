# Publishes the LAN Chat web app (wifi-chat/public) to GitHub Pages,
# so it can be opened over https on an iPad/iPhone without any computer.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy LAN Chat to GitHub Pages

on:
  push:
    branches: [claude/secure-encryption-protocol-qNz80]
    paths: ['wifi-chat/public/**', '.github/workflows/lan-chat-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wifi-chat/public
      - id: deployment
        uses: actions/deploy-pages@v4
